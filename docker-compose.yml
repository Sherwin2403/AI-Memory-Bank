services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: ai-memory-postgres

    environment:
      POSTGRES_USER: memory_user
      POSTGRES_PASSWORD: memory_pass
      POSTGRES_DB: ai_memory

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
